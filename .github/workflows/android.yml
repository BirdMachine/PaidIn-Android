name: PaidIn Android + Scout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Stable PaidIn signing key restored."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured; this APK will use an ephemeral runner key and will not update a previous CI build in place."
          fi
      - name: Build debug APK
        env:
          PAIDIN_VERSION_CODE: ${{ github.run_number }}
          PAIDIN_VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: PaidIn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Launch PaidIn on Android 15 and run startup smoke tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload instrumented-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PaidIn-android-smoke-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  scout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Scout tooling
        run: npm install
      - name: Typecheck Scout worker
        run: npm run typecheck
