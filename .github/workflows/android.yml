name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAIDIN_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paidin-debug-keystore-v1
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare PNG dolphin background
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable-nodpi/ocean_dolphin.webp
          base64 --decode assets-src/ocean_dolphin.png.b64 > app/src/main/res/drawable-nodpi/ocean_dolphin.png
          file app/src/main/res/drawable-nodpi/ocean_dolphin.png
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PaidIn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
